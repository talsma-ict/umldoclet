name: Deploy artifacts

on:
  workflow_run:
    workflows: [ 'Build and test' ]
    types: [ 'completed' ]
    branches: [ 'develop', 'master', 'main' ]

jobs:
  build:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK and Maven Central deployment
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            25
          mvn-toolchain-id: |
            jdk8
            jdk25
          cache: maven
          mvn-server-credentials: central:MAVEN_CENTRAL_USERNAME:MAVEN_CENTRAL_TOKEN
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Publish to Apache Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.SONATYPE_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-snapshot-updates deploy -DskipTests -DskipLicenseCheck -Dmaven.repository.credentialScope=id
